name: Build Lotus Sleep for iPhone

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lotus-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out Lotus Sleep updates
        uses: actions/checkout@v7
        with:
          path: lotus
          persist-credentials: false

      - name: Check out original Luma Sleep base
        uses: actions/checkout@v7
        with:
          repository: ilinoisilmi/Luma-Sleep
          ref: main
          path: luma-base
          persist-credentials: false

      - name: Assemble complete Lotus Sleep source
        run: |
          set -euo pipefail
          mkdir -p merged/build/logs

          # Lotus Sleep is currently an overlay on the original Luma project.
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='build/' \
            luma-base/ merged/
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='build/' \
            lotus/ merged/

          git -C luma-base rev-parse HEAD > merged/build/logs/luma-base-commit.txt
          git -C lotus rev-parse HEAD > merged/build/logs/lotus-update-commit.txt

          for file in \
            LumaSleep.xcodeproj/project.pbxproj \
            LumaSleep.xcodeproj/xcshareddata/xcschemes/LumaBasic.xcscheme \
            Core/Package.swift \
            Scripts/build_unsigned_ipa.sh \
            Scripts/package_ipa.py \
            Scripts/test_package_ipa.py \
            Scripts/audit_project.py \
            Config/App-Info.plist; do
            if [[ ! -f "merged/$file" ]]; then
              echo "Missing required file: $file" >&2
              exit 1
            fi
          done

          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          info = plistlib.loads(Path('merged/Config/App-Info.plist').read_bytes())
          if info.get('CFBundleDisplayName') != 'Lotus Sleep':
              raise SystemExit('Lotus overlay did not set the app display name.')
          print('Confirmed iPhone display name: Lotus Sleep')
          PY

      - name: Check Xcode and iPhone SDK
        working-directory: merged
        run: |
          set -euo pipefail
          xcodebuild -version | tee build/logs/xcode-version.txt
          xcrun --sdk iphoneos --show-sdk-version | tee build/logs/iphone-sdk.txt
          python3 - <<'PY'
          from pathlib import Path
          major = int(Path('build/logs/iphone-sdk.txt').read_text().strip().split('.')[0])
          if major < 26:
              raise SystemExit('iPhoneOS SDK 26 or newer is required.')
          PY

      - name: Audit project and test IPA packaging
        working-directory: merged
        run: |
          set -euo pipefail
          python3 Scripts/audit_project.py \
            2>&1 | tee build/logs/project-audit.txt
          python3 -m unittest discover -s Scripts -p 'test_package_ipa.py' \
            2>&1 | tee build/logs/packaging-tests.txt

      - name: Run Swift core tests
        working-directory: merged
        run: |
          set -euo pipefail
          swift test --package-path Core -j 1 -Xswiftc -disable-batch-mode \
            2>&1 | tee build/logs/core-tests.txt

      - name: Build and package unsigned Lotus iPhone IPA
        working-directory: merged
        run: |
          set -euo pipefail
          bash Scripts/build_unsigned_ipa.sh

          # The original build script outputs LumaSleep-unsigned.ipa.
          # Keep its verified build/packaging procedure and rename only the export.
          test -s build/export/LumaSleep-unsigned.ipa
          mv build/export/LumaSleep-unsigned.ipa \
            build/export/LotusSleep-unsigned.ipa

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import zipfile

          export = Path('build/export')
          ipa = export / 'LotusSleep-unsigned.ipa'
          with zipfile.ZipFile(ipa) as archive:
              if archive.testzip() is not None:
                  raise SystemExit('IPA ZIP integrity test failed')
              if not any(name.startswith('Payload/LumaSleep.app/') for name in archive.namelist()):
                  raise SystemExit('IPA does not contain the built iPhone app')
          digest = hashlib.sha256(ipa.read_bytes()).hexdigest()
          (export / 'SHA256.txt').write_text(f'{digest}  {ipa.name}\n')
          notes = export / 'READ_ME.txt'
          if notes.exists():
              notes.write_text(notes.read_text().replace('Luma Sleep:', 'Lotus Sleep:'))
          print(f'IPA ready: {ipa} ({ipa.stat().st_size:,} bytes)')
          PY

      - name: Upload IPA as a direct downloadable file
        uses: actions/upload-artifact@v7
        with:
          name: LotusSleep-unsigned-ipa
          path: merged/build/export/LotusSleep-unsigned.ipa
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Publish alternative download in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="lotus-unsigned-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" \
            merged/build/export/LotusSleep-unsigned.ipa \
            merged/build/export/SHA256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Lotus Sleep unsigned IPA (build ${GITHUB_RUN_NUMBER})" \
            --notes "Unsigned iPhone build for Sideloadly. Sign it with your own Apple Account. Physical-device testing is still required." \
            --prerelease

          echo "### Download Lotus Sleep IPA" >> "$GITHUB_STEP_SUMMARY"
          echo "Direct IPA: https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/LotusSleep-unsigned.ipa" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: LotusSleep-build-logs
          path: merged/build/logs/
          if-no-files-found: warn
          retention-days: 7
